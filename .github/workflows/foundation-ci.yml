name: Battle Companion Foundation CI

on:
  push:
    branches:
      - battle-companion-foundation
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Report bundle files
        run: du -h build/static/js/* | sort -h

      - name: Deploy demo to GitHub Pages branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/battle-companion-foundation'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          force_orphan: true
